services:
  # Backend Go API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fid_backend
    restart: always
    environment:
      PORT: 8080
      JWT_SECRET: ${JWT_SECRET:-super-secret-attendance-key-2026}
      DB_DRIVER: ${DB_DRIVER:-postgres}
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-fid123!!}
      DB_NAME: ${DB_NAME:-fid_attendance}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${BACKEND_PORT:-8088}:8080"
    volumes:
      - backend_uploads:/app/uploads

  # Frontend React Web Service (Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fid_frontend
    restart: always
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend

  # Mobile Flutter Web PWA Service
  mobile:
    build:
      context: ./mobile
      dockerfile: Dockerfile
    container_name: fid_mobile_pwa
    restart: always
    ports:
      - "${MOBILE_PORT:-3001}:80"
    depends_on:
      - backend

volumes:
  backend_uploads:
