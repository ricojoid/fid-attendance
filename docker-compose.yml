version: '3.8'

services:
  # Backend Go API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fid_backend
    restart: always
    environment:
      PORT: 8080
      JWT_SECRET: ${JWT_SECRET:-super-secret-attendance-key-2026}
      DB_DRIVER: postgres
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-admin}
      DB_PASSWORD: ${DB_PASSWORD:-admin123}
      DB_NAME: ${DB_NAME:-POSTGRES_DB}
      DB_SSLMODE: disable
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:8080"
    volumes:
      - backend_uploads:/app/uploads

  # Frontend React Web Service (Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fid_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  backend_uploads:

