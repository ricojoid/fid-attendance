version: '3.8'

services:
  # Backend Go API Service (SQLite mode)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fid_backend_sqlite
    restart: always
    environment:
      PORT: 8080
      JWT_SECRET: super-secret-attendance-key-2026
      DB_DRIVER: sqlite
      DB_NAME: /app/data/attendance.db
    ports:
      - "8080:8080"
    volumes:
      - sqlite_data:/app/data
      - backend_uploads:/app/uploads

  # Frontend React Web Service (Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fid_frontend_sqlite
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  sqlite_data:
  backend_uploads:
